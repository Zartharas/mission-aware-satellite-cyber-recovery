name: JAIS Export Audit

on:
  push:
    branches:
      - publication/phase1-jais-primary
    paths:
      - 'publication/manuscript/**'
      - 'publication/tables/**'
      - 'references/references.bib'
      - 'publication/submission/journal-of-aerospace-information-systems/**'
      - '.github/workflows/jais-export-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Word renderer dependency
        run: python -m pip install --disable-pip-version-check python-docx==1.1.2

      - name: Build final JAIS target manuscript and export audit
        run: python publication/submission/journal-of-aerospace-information-systems/build_jais_final_export.py

      - name: Audit AIAA reference archivality and completeness
        run: python publication/submission/journal-of-aerospace-information-systems/audit_jais_references.py

      - name: Render JAIS Word manuscript
        run: python publication/submission/journal-of-aerospace-information-systems/make_jais_docx.py

      - name: Apply final submission prose normalization
        run: python publication/submission/journal-of-aerospace-information-systems/finalize_jais_submission_docx.py

      - name: Audit submission-facing editorial hygiene
        run: python publication/submission/journal-of-aerospace-information-systems/audit_jais_submission_style.py

      - name: Show export, reference, and submission-style audits
        run: |
          cat publication/submission/journal-of-aerospace-information-systems/upload-packet/generated/JAIS_EXPORT_AUDIT.md
          cat publication/submission/journal-of-aerospace-information-systems/upload-packet/generated/JAIS_REFERENCE_AUDIT.md
          cat publication/submission/journal-of-aerospace-information-systems/upload-packet/generated/JAIS_SUBMISSION_STYLE_AUDIT.md

      - name: Hash generated files
        shell: bash
        run: |
          cd publication/submission/journal-of-aerospace-information-systems/upload-packet/generated
          sha256sum JAIS_MANUSCRIPT.md JAIS_MANUSCRIPT.docx JAIS_EXPORT_AUDIT.json JAIS_EXPORT_AUDIT.md JAIS_REFERENCE_MAP.csv JAIS_REFERENCE_AUDIT.json JAIS_REFERENCE_AUDIT.md JAIS_SUBMISSION_STYLE_AUDIT.json JAIS_SUBMISSION_STYLE_AUDIT.md > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload generated JAIS packet
        uses: actions/upload-artifact@v7
        with:
          name: jais-paper1-export-${{ github.sha }}
          path: publication/submission/journal-of-aerospace-information-systems/upload-packet/generated/
          if-no-files-found: error
          retention-days: 30
