name: Validate Study 2 security assurance

on:
  push:
    branches:
      - main
      - "study2/**"
    paths:
      - "study2/**"
      - "src/mission_recovery/events.py"
      - "src/mission_recovery/policies.py"
      - "configs/wp5_event_catalog.json"
      - "configs/wp6_policy_rules.json"
      - ".github/workflows/validate-study2-security.yml"
      - ".github/workflows/run-study2-phase6-campaign.yml"
  pull_request:
    paths:
      - "study2/**"
      - "src/mission_recovery/events.py"
      - "src/mission_recovery/policies.py"
      - "configs/wp5_event_catalog.json"
      - "configs/wp6_policy_rules.json"
      - ".github/workflows/validate-study2-security.yml"
      - ".github/workflows/run-study2-phase6-campaign.yml"

permissions:
  contents: read

jobs:
  study2-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository with full provenance history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Study 2 assurance image
        run: docker build --file study2/Dockerfile --tag satellite-study2-assurance .

      - name: Run Study 2 assurance checks
        run: |
          if [[ -f study2/PHASE6_CAMPAIGN_AUTHORIZATION.json ]]; then
            docker run --rm -e STUDY2_PHASE6_AUTH_EXPECTED=1 satellite-study2-assurance
          else
            docker run --rm satellite-study2-assurance
          fi

      - name: Confirm validation produced no tracked-file drift
        run: git diff --exit-code
