name: Study 7E pre-canonical qualification

on:
  push:
    branches:
      - "paper3/s7e-aerc-implementation-feasibility-*"
    paths:
      - "study7e/**"
      - ".github/workflows/study7e-precanonical-qualification.yml"
  pull_request:
    paths:
      - "study7e/**"
      - ".github/workflows/study7e-precanonical-qualification.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile pre-canonical implementation
        run: |
          python -m py_compile \
            study7e/src/aerc_design.py \
            study7e/models/training_contracts.py \
            study7e/audit/independent_design_audit.py \
            study7e/tests/test_design_contracts.py \
            study7e/tests/test_training_contracts.py \
            study7e/validation/check_fsw_truth_leakage.py \
            study7e/validation/validate_precanonical.py \
            study7e/tools/generate_scenario_manifest.py

      - name: Run design and training-boundary contract tests
        run: |
          python -m unittest \
            study7e.tests.test_design_contracts \
            study7e.tests.test_training_contracts \
            -v

      - name: Run independent pre-canonical design audit
        run: python study7e/audit/independent_design_audit.py

      - name: Enforce flight-software truth-leakage boundary
        run: python study7e/validation/check_fsw_truth_leakage.py

      - name: Run pre-canonical governance validator
        run: python study7e/validation/validate_precanonical.py

      - name: Generate design manifest in temporary storage
        run: |
          python study7e/tools/generate_scenario_manifest.py --output /tmp/study7e_scenario_manifest.csv
          test "$(wc -l < /tmp/study7e_scenario_manifest.csv | tr -d ' ')" = "281"

      - name: Require canonical execution remains impossible
        run: |
          set -euo pipefail
          test ! -e study7e/CANONICAL_EXECUTION_AUTHORIZATION.json
          test ! -e .github/workflows/study7e-canonical-execution.yml
          test ! -e study7e/models/frozen_model_manifest.json
          test ! -e study7e/models/L0_BASE.joblib
          test ! -e study7e/models/L1_CORROBORATED.joblib
          if [ -d study7e/results ]; then
            test -z "$(find study7e/results -type f -print -quit)"
          fi
          echo "canonical_execution_guard=PASS"
          echo "canonical_results_generated=false"

      - name: Confirm no Study 7 mutation in this implementation branch
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if git diff --name-only origin/main...HEAD | grep '^study7/'; then
            echo "ERROR: frozen Study 7 path changed"
            exit 1
          fi
          echo "study7_freeze_guard=PASS"


  upstream-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve exact upstream release tags
        run: |
          set -euo pipefail
          CFS_SHA="$(git ls-remote https://github.com/nasa/cFS.git refs/tags/v7.0.1 | awk '{print $1}')"
          NOS3_SHA="$(git ls-remote https://github.com/nasa/nos3.git refs/tags/v1_07_05 | awk '{print $1}')"
          test "$CFS_SHA" = "088b2fa828db9ff7e00733f1908e0eeb59f66ce3"
          test "$NOS3_SHA" = "5a3bdee6be9a2c67fdf994ae6db56d5c60395302"
          echo "cfs_tag_identity=PASS"
          echo "nos3_tag_identity=PASS"
          echo "scientific_execution=false"

  cfs-build-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Clone exact cFS v7.0.1 bundle
        run: |
          set -euo pipefail
          git clone --branch v7.0.1 --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/nasa/cFS.git /tmp/s7e-cfs
          test "$(git -C /tmp/s7e-cfs rev-parse HEAD)" = "088b2fa828db9ff7e00733f1908e0eeb59f66ce3"
          test -z "$(git -C /tmp/s7e-cfs status --short)"

      - name: Build and test cFS native_std candidate
        run: |
          set -euo pipefail
          cd /tmp/s7e-cfs
          make native_std.prep
          make native_std.install
          make native_std.runtest
          echo "cfs_v701_native_std_feasibility=PASS"
          echo "study7e_scenarios_executed=0"
          echo "scientific_results_generated=false"


  cfs-custom-app-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Study 7E implementation
        uses: actions/checkout@v6

      - name: Clone exact cFS v7.0.1 bundle
        run: |
          set -euo pipefail
          git clone --branch v7.0.1 --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/nasa/cFS.git /tmp/s7e-cfs
          test "$(git -C /tmp/s7e-cfs rev-parse HEAD)" = "088b2fa828db9ff7e00733f1908e0eeb59f66ce3"

      - name: Integrate non-canonical AERC Software Bus probe
        run: |
          set -euo pipefail
          cp -a study7e/fsw/aerc_bus_probe /tmp/s7e-cfs/apps/aerc_bus_probe
          printf '\nLIST(APPEND MISSION_GLOBAL_APPLIST aerc_bus_probe)\n' >> /tmp/s7e-cfs/sample_defs/targets.cmake
          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/s7e-cfs/sample_defs/generate_startup.cmake")
          text = path.read_text(encoding="utf-8")
          needle = '"CFE_APP, sample_app,  SAMPLE_APP_Main,    SAMPLE_APP,   50,   32768, 0x0, 0;\\n"\n'
          replacement = needle + '        "CFE_APP, aerc_bus_probe, AERC_BUS_PROBE_Main, AERC_PROBE, 55, 32768, 0x0, 0;\\n"\n'
          if needle not in text:
              raise SystemExit("sample-app startup insertion point not found")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY

      - name: Build cFS with Study 7E bus probe
        run: |
          set -euo pipefail
          cd /tmp/s7e-cfs
          make native_std.prep
          make native_std.install
          test -f build-native_std/exe/cpu1/aerc_bus_probe.so
          echo "aerc_bus_probe_compile=PASS"

      - name: Run non-canonical cFE Software Bus smoke check
        run: |
          set -euo pipefail
          cd /tmp/s7e-cfs/build-native_std/exe/cpu1
          set +e
          timeout 20 ./core-cpu1 > /tmp/aerc_bus_probe_runtime.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            cat /tmp/aerc_bus_probe_runtime.log
            exit "$rc"
          fi
          cat /tmp/aerc_bus_probe_runtime.log
          grep -F "AERC_BUS_PROBE PASS" /tmp/aerc_bus_probe_runtime.log
          echo "aerc_bus_probe_runtime=PASS"
          echo "study7e_scientific_scenarios_executed=0"
          echo "scientific_results_generated=false"
