name: Export exact Acta editorial package

on:
  push:
    branches:
      - publication/study8-acta-editorial-freeze
    paths:
      - .github/workflows/export-acta-editorial-exact.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact editorial branch
        uses: actions/checkout@v4
        with:
          ref: publication/study8-acta-editorial-freeze
      - name: Verify freeze 002 checksum ledger in place
        shell: bash
        run: |
          set -euo pipefail
          cd publication/Paper_4_Study_8/Acta_Astronautica
          sha256sum -c SHA256SUMS.txt
      - name: Upload exact unchanged Acta workspace
        uses: actions/upload-artifact@v4
        with:
          name: acta-study8-editorial-freeze002-workspace
          path: publication/Paper_4_Study_8/Acta_Astronautica/
          if-no-files-found: error
