name: Study 7E qualifier fault feasibility

on:
  pull_request:
    branches:
      - main
    paths:
      - "study7e/feasibility/qualifier_fault/**"
      - "study7e/configs/qualifier_time_replay_contract_draft.json"
      - "study7e/configs/fault_transformations_draft.json"
      - ".github/workflows/study7e-qualifier-fault-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-qualifier-fault-change:
    runs-on: ubuntu-latest
    outputs:
      run_gate: ${{ steps.diff.outputs.run_gate }}
      qualification_head: ${{ steps.diff.outputs.qualification_head }}

    steps:
      - name: Check out exact PR head for change detection
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Determine whether qualifier/fault feasibility rerun is needed
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
            echo "qualification_head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_sha="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$head_sha"
          echo "qualification_head=$head_sha" >> "$GITHUB_OUTPUT"

          if git diff --name-only HEAD^ HEAD -- \
            study7e/feasibility/qualifier_fault \
            study7e/configs/qualifier_time_replay_contract_draft.json \
            study7e/configs/fault_transformations_draft.json \
            .github/workflows/study7e-qualifier-fault-feasibility.yml | grep -q .; then
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_gate=false" >> "$GITHUB_OUTPUT"
          fi

  qualifier-fault-contract:
    needs: latest-qualifier-fault-change
    if: needs.latest-qualifier-fault-change.outputs.run_gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact qualification head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.latest-qualifier-fault-change.outputs.qualification_head }}

      - name: Bind contract evidence to exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.latest-qualifier-fault-change.outputs.qualification_head }}"
          echo "qualification_head=$(git rev-parse HEAD)"

      - name: Run host-only qualifier and F0-F12 contract tests
        run: |
          set -euo pipefail
          python -m unittest -v study7e.feasibility.qualifier_fault.test_qualifier_fault_model 2>&1 | tee /tmp/study7e_qualifier_fault_report.txt
          grep -F "Ran 16 tests" /tmp/study7e_qualifier_fault_report.txt
          grep -F "OK" /tmp/study7e_qualifier_fault_report.txt
          echo "qualifier_fault_contract_tests=PASS" | tee -a /tmp/study7e_qualifier_fault_report.txt
          echo "fault_profiles_tested=13" | tee -a /tmp/study7e_qualifier_fault_report.txt
          echo "policy_decisions_executed=0" | tee -a /tmp/study7e_qualifier_fault_report.txt
          echo "production_models_trained=false" | tee -a /tmp/study7e_qualifier_fault_report.txt
          echo "study7e_scientific_scenarios_executed=0" | tee -a /tmp/study7e_qualifier_fault_report.txt
          echo "scientific_results_generated=false" | tee -a /tmp/study7e_qualifier_fault_report.txt

      - name: Preserve qualifier/fault engineering report
        uses: actions/upload-artifact@v4
        with:
          name: study7e-qualifier-fault-feasibility
          path: /tmp/study7e_qualifier_fault_report.txt
          if-no-files-found: error
