name: Finalize Acta Study 8 package

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      ACTA_OUT: publication/Paper_4_Study_8/Acta_Astronautica
    steps:
      - name: Check out package branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install document dependency
        run: python -m pip install 'python-docx==1.2.0'

      - name: Finalize abstract and keywords
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn

          path = Path('publication/Paper_4_Study_8/Acta_Astronautica/ACTA_ASTRONAUTICA_MANUSCRIPT.docx')
          doc = Document(path)
          abstract = (
              'Long-lived space systems must be able to change cryptographic state without assuming continuous connectivity. '
              'This study evaluates trusted post-compromise cryptographic transition as a deterministic finite systems problem under intermittent logical contact. '
              'A frozen 3 x 4 x 4 x 4 x 6 x 3 factorial model crosses three ML-KEM/ML-DSA profiles, four recovery policies, four equal-total-capacity contact regimes, four bounded non-cryptanalytic disruptions, six compromise phase offsets, and three logical deadlines, yielding 3,456 modeled positions. '
              'The primary endpoint is trusted recovery before deadline. Because the inferential object is the complete frozen population, results are reported as exact counts and proportions without sampling p-values or confidence intervals; a separately implemented same-repository reference model reproduced all 3,456 rows exactly. '
              'All four policies achieved 635/864 trusted recoveries (73.4954%), and the prespecified contact-aware staged-minus-staged risk difference was 0.000000 percentage points marginally and in every prespecified stratum. '
              'Success differed substantially by standardized cryptographic-object burden: 93.7500% for ML-KEM-512/ML-DSA-44, 64.9306% for ML-KEM-768/ML-DSA-65, and 61.8056% for ML-KEM-1024/ML-DSA-87. '
              'Success was non-increasing with object burden across all 1,152 matched non-profile positions. Contact timing and logical deadline also changed feasibility despite equal full-cycle capacity. '
              'Policy choice instead redistributed predecessor exposure, control unavailability, dual-epoch overlap, modeled transfer burden, attempts, and failure classification. '
              'In this model, contact-aware guarding does not create recovery capacity; feasibility is governed by object burden, contact structure, and deadline, while policy primarily changes security-state and availability costs.'
          )
          keywords = 'cryptographic agility; post-quantum cryptography; ML-KEM; ML-DSA; satellite cybersecurity; intermittent connectivity'

          paras = doc.paragraphs
          abstract_idx = next(i for i,p in enumerate(paras) if p.text.strip() == 'Abstract')
          paras[abstract_idx + 1].text = abstract
          kp = next(p for p in paras if p.text.strip().startswith('Keywords:'))
          kp.clear()
          r = kp.add_run('Keywords: ')
          r.bold = True
          kp.add_run(keywords)

          for table in doc.tables:
              trPr = table.rows[0]._tr.get_or_add_trPr()
              if trPr.find(qn('w:tblHeader')) is None:
                  hdr = OxmlElement('w:tblHeader')
                  hdr.set(qn('w:val'), 'true')
                  trPr.append(hdr)

          doc.save(path)
          print('manuscript_finalized=PASS')
          PY

      - name: Validate exact manuscript contract
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from zipfile import ZipFile
          from docx import Document

          root = Path('publication/Paper_4_Study_8/Acta_Astronautica')
          m = root / 'ACTA_ASTRONAUTICA_MANUSCRIPT.docx'
          doc = Document(m)
          paras = [p.text.strip() for p in doc.paragraphs]
          ai = paras.index('Abstract')
          abstract = paras[ai+1]
          assert len(re.findall(r"\b[\w'-]+\b", abstract)) == 226
          kp = next(x for x in paras if x.startswith('Keywords:'))
          assert len([x for x in kp.split(':',1)[1].split(';') if x.strip()]) == 6
          assert len(doc.tables) == 4
          text = '\n'.join(paras) + '\n' + '\n'.join(c.text for t in doc.tables for row in t.rows for c in row.cells)
          for token in ['3,456','635/864','73.4954%','0.000000','93.7500%','64.9306%','61.8056%']:
              assert token in text, token
          with ZipFile(m) as z:
              names = set(z.namelist())
              assert 'word/comments.xml' not in names
              xml = z.read('word/document.xml').decode('utf-8')
              assert re.search(r'<w:ins(?:\s|>)', xml) is None
              assert re.search(r'<w:del(?:\s|>)', xml) is None
              assert xml.count('w:tblHeader') >= 4
          print('final_manuscript_contract=PASS')
          PY

      - name: Hash exact publisher-facing files
        shell: bash
        run: |
          sha256sum \
            "$ACTA_OUT/ACTA_ASTRONAUTICA_MANUSCRIPT.docx" \
            "$ACTA_OUT/ACTA_ASTRONAUTICA_COVER_LETTER.docx" \
            "$ACTA_OUT/ACTA_ASTRONAUTICA_HIGHLIGHTS.docx" \
            "$ACTA_OUT/FIGURE_1_PROFILE_SUCCESS.pdf" \
            "$ACTA_OUT/FIGURE_2_CONTACT_REGIME_SUCCESS.pdf"

      - name: Capture exact package for final QA
        uses: actions/upload-artifact@v4
        with:
          name: acta-study8-final-binaries
          compression-level: 0
          path: |
            ${{ env.ACTA_OUT }}/ACTA_ASTRONAUTICA_MANUSCRIPT.docx
            ${{ env.ACTA_OUT }}/ACTA_ASTRONAUTICA_COVER_LETTER.docx
            ${{ env.ACTA_OUT }}/ACTA_ASTRONAUTICA_HIGHLIGHTS.docx
            ${{ env.ACTA_OUT }}/FIGURE_1_PROFILE_SUCCESS.pdf
            ${{ env.ACTA_OUT }}/FIGURE_2_CONTACT_REGIME_SUCCESS.pdf

      - name: Commit finalized manuscript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ACTA_OUT/ACTA_ASTRONAUTICA_MANUSCRIPT.docx"
          if git diff --cached --quiet; then
            echo 'No manuscript change to commit.'
            exit 0
          fi
          git commit -m 'Finalize Acta Study 8 abstract and keywords [skip acta-patch]'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
