name: Run Study 7 learned selector campaign

on:
  push:
    branches:
      - 'study7/learned-selector-campaign'
    paths:
      - 'study7/STUDY7_CAMPAIGN_FREEZE.json'
      - 'study7/CAMPAIGN_AUTHORIZATION.json'
      - 'study7/CAMPAIGN_ATTEMPT_LEDGER.json'
      - '.github/workflows/run-study7-learned-selector-campaign.yml'

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Confirm frozen scientific implementation has not drifted
        run: |
          git diff --exit-code 35565bfbbde7ec217e2a8deb20dbfc572d80c991 -- \
            study7/STUDY7_PROTOCOL.json \
            study7/src/learned_selector_model.py \
            study7/tests/test_learned_selector_model.py \
            study7/analysis/analyze.py \
            study7/analysis/audit_independent.py
      - name: Validate authorization and freeze
        run: |
          python -m json.tool study7/STUDY7_CAMPAIGN_FREEZE.json >/dev/null
          python -m json.tool study7/CAMPAIGN_AUTHORIZATION.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path('study7/STUDY7_CAMPAIGN_FREEZE.json').read_text())
          a=json.loads(Path('study7/CAMPAIGN_AUTHORIZATION.json').read_text())
          assert f['design_merge_commit']=='35565bfbbde7ec217e2a8deb20dbfc572d80c991'
          assert f['expected_population']['observations']==1033
          assert a['authorization_status']=='ACTIVE_FOR_ONE_CANONICAL_FINITE_EXECUTION'
          assert a['consumed'] is False
          assert f['execution_constraints']['attack_optimizer'] is False
          assert f['execution_constraints']['hidden_truth_as_policy_input'] is False
          print('study7_campaign_binding=PASS')
          PY
      - name: Pre-campaign assurance
        run: |
          python -m compileall -q study7
          python -m unittest discover -s study7/tests -p 'test_*.py' -v
      - name: Execute exact finite population
        run: python study7/analysis/analyze.py study7_runtime
      - name: Verify frozen hashes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          f=json.loads(Path('study7/STUDY7_CAMPAIGN_FREEZE.json').read_text())
          for name,expected in f['expected_deterministic_output_sha256'].items():
              actual=hashlib.sha256((Path('study7_runtime')/name).read_bytes()).hexdigest()
              print(f'{name}={actual}')
              assert actual==expected,(name,actual,expected)
          print('study7_checksum_binding=PASS')
          PY
      - name: Independently audit evidence
        run: |
          python study7/analysis/audit_independent.py study7_runtime | tee study7_runtime/INDEPENDENT_AUDIT.txt
          grep -q '^study7_independent_audit=PASS$' study7_runtime/INDEPENDENT_AUDIT.txt
      - name: Record provenance
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p={
            'schema':1,
            'experiment_id':'S7-LSO-001',
            'execution_commit':os.environ['GITHUB_SHA'],
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'design_merge_commit':'35565bfbbde7ec217e2a8deb20dbfc572d80c991',
            'independent_audit':'PASS',
            'runtime':'DETERMINISTIC_FINITE_LEARNED_SELECTOR_MODEL',
            'attack_optimizer_implemented':False,
            'reinforcement_learning_implemented':False,
            'hidden_truth_as_policy_input':False
          }
          Path('study7_runtime/EXECUTION_PROVENANCE.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
      - name: Confirm no tracked-file drift
        run: git diff --exit-code
      - name: Upload Study 7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: study7-lso-001-evidence-${{ github.sha }}
          path: study7_runtime/
          retention-days: 90
          if-no-files-found: error
