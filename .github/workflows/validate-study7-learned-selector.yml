name: Validate Study 7 learned selector observability

on:
  pull_request:
    paths:
      - 'study7/**'
      - '.github/workflows/validate-study7-learned-selector.yml'
  push:
    branches:
      - 'study7/learned-selector-observability'
    paths:
      - 'study7/**'
      - '.github/workflows/validate-study7-learned-selector.yml'

permissions:
  contents: read

jobs:
  validate-study7:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate protocol and closeout metadata
        run: |
          python -m json.tool study7/STUDY7_PROTOCOL.json >/dev/null
          if [ -f study7/results/RESULTS_FREEZE.json ]; then
            python -m json.tool study7/results/RESULTS_FREEZE.json >/dev/null
          fi
      - name: Compile Study 7
        run: python -m compileall -q study7
      - name: Run Study 7 invariants
        run: python -m unittest discover -s study7/tests -p 'test_*.py' -v
      - name: Execute exact finite population
        run: python study7/analysis/analyze.py study7_runtime
      - name: Independently audit Study 7 evidence
        run: |
          python study7/analysis/audit_independent.py study7_runtime | tee study7_runtime/INDEPENDENT_AUDIT.txt
          grep -q '^study7_independent_audit=PASS$' study7_runtime/INDEPENDENT_AUDIT.txt
      - name: Validate report boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('study7_runtime/REPORT.json').read_text())
          assert r['finite_population_observations']==1033
          assert r['block_a_visible_only_errors']==0
          assert r['block_b_corroboration_errors']==2
          assert r['block_b_corroboration_unsafe_proceed']==1
          assert r['block_b_corroboration_false_conservative']==1
          assert r['hidden_objective_authorization_is_policy_input'] is False
          assert r['attack_optimizer_implemented'] is False
          assert r['reinforcement_learning_implemented'] is False
          assert r['global_model_ranking_claimed'] is False
          assert r['current_computers_and_security_manuscript_modified'] is False
          print('study7_report_boundary=PASS')
          PY
      - name: Validate canonical closeout when present
        run: |
          if [ -f study7/results/CANONICAL_POLICY_SUMMARY.csv ]; then
            cmp study7/results/CANONICAL_POLICY_SUMMARY.csv study7_runtime/policy_summary.csv
            python - <<'PY'
          import hashlib,json
          from pathlib import Path
          f=json.loads(Path('study7/results/RESULTS_FREEZE.json').read_text())
          assert f['status']=='CANONICAL_RESULTS_FROZEN'
          assert f['population']['total']==1033
          assert f['independent_audit']=='PASS'
          assert f['hidden_objective_authorization_is_policy_input'] is False
          assert f['attack_optimizer_implemented'] is False
          for name,expected in f['frozen_output_sha256'].items():
              actual=hashlib.sha256((Path('study7_runtime')/name).read_bytes()).hexdigest()
              assert actual==expected,(name,actual,expected)
          print('study7_canonical_closeout_binding=PASS')
          PY
          fi
      - name: Confirm no tracked-file drift
        run: git diff --exit-code
