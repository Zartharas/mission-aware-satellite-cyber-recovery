name: Study 7E cFS preselection seams

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cfs-preselection-seams:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Study 7E qualification branch
        uses: actions/checkout@v6

      - name: Clone exact cFS v7.0.1 bundle
        run: |
          set -euo pipefail
          git clone --branch v7.0.1 --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/nasa/cFS.git /tmp/s7e-cfs
          test "$(git -C /tmp/s7e-cfs rev-parse HEAD)" = "088b2fa828db9ff7e00733f1908e0eeb59f66ce3"

      - name: Integrate non-canonical Study 7E seam probes
        run: |
          set -euo pipefail
          cp -a study7e/fsw/aerc_sbn_probe /tmp/s7e-cfs/apps/aerc_sbn_probe
          cp -a study7e/fsw/aerc_hs_probe /tmp/s7e-cfs/apps/aerc_hs_probe
          printf '\nLIST(APPEND MISSION_GLOBAL_APPLIST aerc_sbn_probe aerc_hs_probe)\n' >> /tmp/s7e-cfs/sample_defs/targets.cmake

      - name: Build cFS with preselection seam probes
        run: |
          set -euo pipefail
          cd /tmp/s7e-cfs
          make native_std.prep
          make native_std.install
          for cpu in cpu1 cpu2; do
            test -f "build-native_std/exe/$cpu/cf/aerc_sbn_probe.so"
            test -f "build-native_std/exe/$cpu/cf/aerc_hs_probe.so"
            test -f "build-native_std/exe/$cpu/cf/sbn_conf_tbl.tbl"
          done

      - name: Stage deterministic two-instance SBN startup
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          entry = "CFE_APP, aerc_sbn_probe, AERC_SBN_PROBE_Main, AERC_SBN_PROBE, 60, 32768, 0x0, 0;\n"
          for cpu in ("cpu1", "cpu2"):
              path = Path(f"/tmp/s7e-cfs/build-native_std/exe/{cpu}/cf/cfe_es_startup.scr")
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              lines = [
                  line for line in lines
                  if "ci_lab" not in line
                  and "to_lab" not in line
                  and "aerc_hs_probe" not in line
              ]
              if any("aerc_sbn_probe" in line for line in lines):
                  raise SystemExit(f"duplicate aerc_sbn_probe startup entry in {cpu}")
              lines.append(entry)
              path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Run two live cFS instances with SBN roundtrip
        run: |
          set -euo pipefail
          rm -f /tmp/s7e-cpu1.log /tmp/s7e-cpu2.log

          set +e
          (
            cd /tmp/s7e-cfs/build-native_std/exe/cpu2
            timeout 25 ./core-cpu2 > /tmp/s7e-cpu2.log 2>&1
          ) &
          p2=$!

          sleep 2

          (
            cd /tmp/s7e-cfs/build-native_std/exe/cpu1
            timeout 25 ./core-cpu1 > /tmp/s7e-cpu1.log 2>&1
          ) &
          p1=$!

          wait "$p1"
          rc1=$?
          wait "$p2"
          rc2=$?
          set -e

          cat /tmp/s7e-cpu1.log
          cat /tmp/s7e-cpu2.log

          for rc in "$rc1" "$rc2"; do
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
              echo "unexpected cFS process exit rc=$rc"
              exit "$rc"
            fi
          done

          grep -F "SBN_UDP Lib Initialized." /tmp/s7e-cpu1.log
          grep -F "SBN_UDP Lib Initialized." /tmp/s7e-cpu2.log
          grep -F "configured peer (SC=66, CPU=2" /tmp/s7e-cpu1.log
          grep -F "configured peer (SC=66, CPU=1" /tmp/s7e-cpu2.log
          grep -F "AERC_SBN_SINK PASS scenario=0x53374532 marker=0xA37C0DE2 sink_cpu=2 receipt=0xBEEF" /tmp/s7e-cpu2.log
          grep -F "AERC_SBN_ROUNDTRIP PASS scenario=0x53374532 marker=0xA37C0DE2 sink_cpu=2 receipt=0xBEEF" /tmp/s7e-cpu1.log

          echo "cfs_two_instance_sbn=PASS"
          echo "scenario_id_end_to_end=PASS"
          echo "sink_receipt_capture=PASS"

      - name: Stage isolated HS observation startup
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/s7e-cfs/build-native_std/exe/cpu1/cf/cfe_es_startup.scr")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          lines = [
              line for line in lines
              if "aerc_sbn_probe" not in line
              and "CFE_APP, sbn," not in line
          ]
          if any("aerc_hs_probe" in line for line in lines):
              raise SystemExit("duplicate aerc_hs_probe startup entry")
          lines.append("CFE_APP, aerc_hs_probe, AERC_HS_PROBE_Main, AERC_HS_PROBE, 60, 32768, 0x0, 0;\n")
          path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Observe pinned HS housekeeping state
        run: |
          set -euo pipefail
          rm -f /tmp/s7e-hs.log

          set +e
          (
            cd /tmp/s7e-cfs/build-native_std/exe/cpu1
            timeout 12 ./core-cpu1 > /tmp/s7e-hs.log 2>&1
          )
          rc=$?
          set -e

          cat /tmp/s7e-hs.log

          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "unexpected HS observation cFS exit rc=$rc"
            exit "$rc"
          fi

          grep -F "AERC_HS_OBSERVER PASS appmon=" /tmp/s7e-hs.log
          grep -F "AERC_HS_OBSERVER PASS received HS housekeeping" /tmp/s7e-hs.log

          echo "hs_housekeeping_observable=PASS"
          echo "research_truth_derived=false"
          echo "study7e_scientific_scenarios_executed=0"
          echo "scientific_results_generated=false"

      - name: Preserve seam-smoke logs
        uses: actions/upload-artifact@v4
        with:
          name: study7e-cfs-preselection-seam-logs
          path: |
            /tmp/s7e-cpu1.log
            /tmp/s7e-cpu2.log
            /tmp/s7e-hs.log
          if-no-files-found: error
