name: Reproduce WP10 statistical analysis

on:
  push:
    branches: [main]
    paths:
      - "analysis/**"
      - ".github/workflows/reproduce-wp10.yml"
  pull_request:
    paths:
      - "analysis/**"
      - ".github/workflows/reproduce-wp10.yml"

permissions:
  contents: read

jobs:
  reproduce_wp10:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: analysis/requirements.txt

      - name: Install WP10 reproduction dependencies
        run: |
          python -m pip install --only-binary=:all: --requirement analysis/requirements.txt

      - name: Reproduce and validate frozen WP10 statistical contracts
        run: python analysis/reproduce_wp10.py --validate

      - name: Run WP10 reproduction regression test
        run: python -m unittest discover -s analysis/tests -p 'test_*.py'
