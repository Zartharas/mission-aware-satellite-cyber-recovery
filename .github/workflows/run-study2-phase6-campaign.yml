name: Execute Study 2 Phase 6 frozen campaign

on:
  push:
    branches:
      - main
    paths:
      - "study2/PHASE6_CAMPAIGN_AUTHORIZATION.json"

permissions:
  contents: read

jobs:
  phase6-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact authorized repository state
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify authorization lifecycle state
        id: auth_state
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path("study2/PHASE6_CAMPAIGN_AUTHORIZATION.json")
          if not path.is_file():
              raise SystemExit("Phase-6 authorization file is absent")
          payload = json.loads(path.read_text(encoding="utf-8"))
          active = payload.get("active") is True and payload.get("consumed") is False
          consumed = payload.get("active") is False and payload.get("consumed") is True
          if not (active or consumed):
              raise SystemExit("invalid Phase-6 authorization lifecycle state")
          print(f"execute={'true' if active else 'false'}")
          print(f"consumed={'true' if consumed else 'false'}")
          PY

      - name: Confirm consumed authorization does not execute again
        if: steps.auth_state.outputs.consumed == 'true'
        run: echo "phase6_authorization_consumed=true campaign_execution_skipped=true"

      - name: Build hash-bound Study 2 image
        if: steps.auth_state.outputs.execute == 'true'
        run: docker build --file study2/Dockerfile --tag satellite-study2-assurance .

      - name: Revalidate assurance with Phase 6 authorization present
        if: steps.auth_state.outputs.execute == 'true'
        run: docker run --rm -e STUDY2_PHASE6_AUTH_EXPECTED=1 satellite-study2-assurance

      - name: Execute exact frozen Study 2 campaign once
        if: steps.auth_state.outputs.execute == 'true'
        run: |
          docker run --rm \
            --entrypoint python \
            -v "$RUNNER_TEMP:/runner-temp" \
            satellite-study2-assurance \
            study2/scripts/run_phase6_campaign.py \
            --output-dir /runner-temp/study2-phase6-evidence

      - name: Verify evidence file hashes before upload
        if: steps.auth_state.outputs.execute == 'true'
        run: |
          cd "$RUNNER_TEMP/study2-phase6-evidence"
          sha256sum observations.jsonl attempt_ledger.jsonl runtime_bindings.json campaign_summary.json evidence_hashes.json

      - name: Upload immutable campaign evidence candidate
        if: steps.auth_state.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: study2-phase6-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/study2-phase6-evidence/
          if-no-files-found: error
          retention-days: 90
