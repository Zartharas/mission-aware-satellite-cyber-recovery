name: Study 8E one-time canonical dispatch bridge

on:
  push:
    branches:
      - main
    paths:
      - "study8e/CANONICAL_EXECUTION_TRIGGER_001.json"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch frozen canonical workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/study8e-canonical-execution.yml/dispatches" \
            --data '{"ref":"main"}'
