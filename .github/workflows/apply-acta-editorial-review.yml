name: Apply Acta editorial review

on:
  push:
    branches:
      - publication/study8-acta-editorial-freeze
    paths:
      - .github/workflows/apply-acta-editorial-review.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out editorial branch
        uses: actions/checkout@v4
        with:
          ref: publication/study8-acta-editorial-freeze
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document dependency
        run: python -m pip install --disable-pip-version-check python-docx
      - name: Reconstruct audited editorial patch
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .acta_editorial_patch/payload_*.txt
          cat .acta_editorial_patch/payload_*.txt > /tmp/patch.b64
          echo 'd368cbc0538f434b64d52fe715ac9238405a4e3bf547f322b3730451f2a8ff69  /tmp/patch.b64' | sha256sum -c -
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          raw = base64.b64decode(Path('/tmp/patch.b64').read_text().strip())
          Path('/tmp/apply_acta_editorial_review.py').write_bytes(zlib.decompress(raw))
          PY
      - name: Apply and verify editorial review
        run: python /tmp/apply_acta_editorial_review.py
      - name: Commit exact reviewed documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            publication/Paper_4_Study_8/Acta_Astronautica/ACTA_ASTRONAUTICA_MANUSCRIPT.docx \
            publication/Paper_4_Study_8/Acta_Astronautica/ACTA_ASTRONAUTICA_COVER_LETTER.docx \
            publication/Paper_4_Study_8/Acta_Astronautica/ACTA_ASTRONAUTICA_HIGHLIGHTS.docx
          git diff --cached --quiet && { echo 'No document changes produced'; exit 1; }
          git commit -m 'Apply Acta editorial review [skip acta-editorial-patch]'
          git push origin HEAD:publication/study8-acta-editorial-freeze

