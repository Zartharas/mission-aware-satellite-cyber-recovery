name: Validate research configurations

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository with full provenance history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            analysis/requirements.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Audit current repository release gate with local-noise regression probes
        run: |
          mkdir -p .venv-analysis/audit-scope-probe
          mkdir -p local-audit-scope-probe
          printf 'not-json\n' > .venv-analysis/audit-scope-probe/ignored.json
          printf 'a,b\n1\n' > .venv-analysis/audit-scope-probe/ignored.csv
          printf '# TODO local dependency marker\n' > .venv-analysis/audit-scope-probe/ignored.py
          printf 'not-json\n' > local-audit-scope-probe/untracked.json
          printf 'a,b\n1\n' > local-audit-scope-probe/untracked.csv
          printf '# FIXME local untracked marker\n' > local-audit-scope-probe/untracked.py
          trap 'rm -rf .venv-analysis/audit-scope-probe local-audit-scope-probe' EXIT
          python scripts/audit_repository_release_gate.py

      - name: Audit Paper 2 Phase 6 timestamp trace design
        run: python scripts/audit_paper2_post_rejection_phase6_timestamp_trace_design.py

      - name: Audit Paper 2 Phase 6B timestamp extraction authorization
        run: python scripts/audit_paper2_post_rejection_phase6b_timestamp_extraction_authorization.py

      - name: Audit Paper 2 Phase 6C trace population freeze preparation
        run: python scripts/audit_paper2_post_rejection_phase6c_trace_population_freeze.py

      - name: Audit Paper 2 Phase 7A recovery replay design
        run: python scripts/audit_paper2_post_rejection_phase7a_recovery_replay_design.py

      - name: Audit Paper 2 Phase 7B replay implementation
        run: python scripts/audit_paper2_post_rejection_phase7b_replay_implementation.py

      - name: Audit Paper 2 Phase 7C runtime authorization preparation
        run: python scripts/audit_paper2_post_rejection_phase7c_runtime_authorization.py

      - name: Audit Paper 2 Phase 7D float-contract correction
        run: python scripts/audit_paper2_post_rejection_phase7d_float_contract_correction.py

      - name: Audit Paper 2 Phase 7E result-freeze preparation
        run: python scripts/audit_paper2_post_rejection_phase7e_result_freeze.py

      - name: Audit Paper 2 Phase 7F interpretation and claim use
        run: python scripts/audit_paper2_post_rejection_phase7f_interpretation_claim_use.py

      - name: Audit Paper 2 post-rejection manuscript rebuild R1
        run: python scripts/audit_paper2_post_rejection_manuscript_rebuild_r1.py

      - name: Audit Paper 2 Rebuild R1 detailed editorial and reference review
        run: python scripts/audit_paper2_rebuild_r1_detailed_audit.py

      - name: Audit Paper 2 post-rejection manuscript rebuild R2
        run: python scripts/audit_paper2_post_rejection_manuscript_rebuild_r2.py

      - name: Audit Paper 2 R2 Figure 1 source and visual QA package
        run: python scripts/audit_paper2_r2_figure1.py

      - name: Audit Paper 2 S6X pre-runtime closeout and build design
        run: python scripts/audit_paper2_s6x_pre_runtime_closeout_build_design.py

      - name: Audit Paper 2 S6X build-environment freeze
        run: python scripts/audit_paper2_s6x_build_environment_freeze.py

      - name: Audit Paper 2 S6X canonical runtime authorization
        run: python scripts/audit_paper2_s6x_canonical_runtime_authorization.py

      - name: Audit Paper 2 S6X Attempt 001 failure freeze and Environment v2 correction
        run: python scripts/audit_paper2_s6x_attempt001_env_v2_correction.py

      - name: Audit Paper 2 S6X Environment v2 materialization handoff
        run: python scripts/audit_paper2_s6x_env_v2_materialization_handoff.py

      - name: Audit Paper 2 S6X Environment v2 freeze
        run: python scripts/audit_paper2_s6x_build_environment_v2_freeze.py

      - name: Audit Paper 2 S6X corrected runtime authorization 002
        run: python scripts/audit_paper2_s6x_corrected_runtime_authorization_002.py

      - name: Audit Paper 2 S6X Attempt 002 failure freeze and runner correction 003
        run: python scripts/audit_paper2_s6x_attempt002_correction003.py

      - name: Audit Paper 2 S6X Attempt 003 failure freeze and reporting correction 004
        run: python scripts/audit_paper2_s6x_attempt003_correction004.py

      - name: Audit Paper 2 S6X canonical result freeze 004
        run: python scripts/audit_paper2_s6x_canonical_result_freeze_004.py

      - name: Audit Paper 2 S6X interpretation, claim use, and R3
        run: |
          R3_HEAD="d3cf8af3def805db7fda97dbda457b7c21f80c84"
          R3_WORKTREE="$RUNNER_TEMP/paper2-r3-historical-audit"
          git cat-file -e "$R3_HEAD^{commit}"
          git worktree add --detach "$R3_WORKTREE" "$R3_HEAD"
          (
            cd "$R3_WORKTREE"
            python scripts/audit_paper2_s6x_interpretation_claim_use_r3.py
          )
          git worktree remove "$R3_WORKTREE"

      - name: Audit historical Paper 2 R4 at its exact merged authority
        run: |
          R4_HEAD="4cd0c30a276b3c5a0494736b93a8d08dc1ed8df4"
          R4_WORKTREE="$RUNNER_TEMP/paper2-r4-historical-audit"
          git cat-file -e "$R4_HEAD^{commit}"
          git worktree add --detach "$R4_WORKTREE" "$R4_HEAD"
          (
            cd "$R4_WORKTREE"
            python scripts/audit_paper2_r4_prevenue_figure_insertion.py
          )
          git worktree remove "$R4_WORKTREE"

      - name: Audit historical Paper 2 CEAS R1 at its exact authorized head
        run: |
          R1_HEAD="ff56f853eb2b7a51e93610ed84ffc4c0e946ee95"
          R1_WORKTREE="$RUNNER_TEMP/paper2-r1-historical-audit"
          git cat-file -e "$R1_HEAD^{commit}"
          git worktree add --detach "$R1_WORKTREE" "$R1_HEAD"
          (
            cd "$R1_WORKTREE"
            python scripts/audit_paper2_ceas_r1.py
          )
          git worktree remove "$R1_WORKTREE"

      - name: Audit Paper 2 CEAS R2 substantive manuscript and source integrity
        run: python scripts/audit_paper2_ceas_r2.py

      - name: Audit bibliography metadata integrity
        run: python scripts/audit_bibliography_metadata.py

      - name: Validate every tracked JSON document
        run: |
          git ls-files -z -- '*.json' \
            | sort -z \
            | while IFS= read -r -d '' file; do
                echo "json: $file"
                python -m json.tool "$file" >/dev/null
              done

      - name: Compile repository Python source roots
        run: python -m compileall -q src scripts tests analysis

      - name: Validate experiment schema fixtures
        run: python scripts/validate_experiment_schema.py

      - name: Run research unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate every tracked shell script syntax
        run: |
          git ls-files -z scripts \
            | while IFS= read -r -d '' script; do
                case "$script" in
                  *.sh)
                    echo "bash -n: $script"
                    bash -n "$script"
                    ;;
                esac
              done

      - name: Install frozen WP10 reproduction dependencies
        run: "python -m pip install --only-binary=:all: --requirement analysis/requirements.txt"

      - name: Reproduce and validate frozen WP10 statistical contracts
        run: python analysis/reproduce_wp10.py --validate

      - name: Run WP10 reconstruction regression tests
        run: python -m unittest discover -s analysis/tests -p 'test_*.py'

      - name: Confirm validation produced no tracked-file drift
        run: git diff --exit-code

  ceas-r2-review-preview:
    if: github.event_name == 'pull_request' && github.head_ref == 'publication/paper2-ceas-r1-controlled-adaptation-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install CEAS manuscript render dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pandoc libreoffice-writer inkscape poppler-utils python3-docx
      - name: Build CEAS R2 Word PDF and source figure preview
        run: bash scripts/build_paper2_ceas_r2_preview.sh "$RUNNER_TEMP/ceas-r2-review"
      - name: Upload CEAS R2 editable reviewer preview
        uses: actions/upload-artifact@v4
        with:
          name: Paper2_CEAS_R2_Review_Proof
          path: |
            ${{ runner.temp }}/ceas-r2-review/PAPER2_CEAS_R2_REVIEW_PROOF.docx
            ${{ runner.temp }}/ceas-r2-review/PAPER2_CEAS_R2_REVIEW_PROOF.pdf
            ${{ runner.temp }}/ceas-r2-review/Fig1.eps
            ${{ runner.temp }}/ceas-r2-review/Fig1_original.svg
            ${{ runner.temp }}/ceas-r2-review/REVIEW_STATUS.txt
          if-no-files-found: error
          retention-days: 14
