name: Validate research configurations

on:
  push:
    branches: [main]
    paths:
      - "configs/**"
      - "scripts/validate_experiment_schema.py"
      - "requirements-dev.txt"
      - "src/**"
      - "tests/**"
      - ".github/workflows/validate-research-configs.yml"
  pull_request:
    paths:
      - "configs/**"
      - "scripts/validate_experiment_schema.py"
      - "requirements-dev.txt"
      - "src/**"
      - "tests/**"
      - ".github/workflows/validate-research-configs.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate JSON syntax
        run: |
          python -m json.tool configs/experiment_model.json >/dev/null
          python -m json.tool configs/experiment_run.schema.json >/dev/null
          python -m json.tool configs/toolchain-lock.json >/dev/null
          python -m json.tool configs/wp5_event_catalog.json >/dev/null

      - name: Validate experiment schema fixtures
        run: python scripts/validate_experiment_schema.py

      - name: Run WP5 unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
