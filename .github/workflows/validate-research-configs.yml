name: Validate research configurations

on:
  push:
    branches: [main]
    paths:
      - "configs/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - "src/**"
      - "tests/**"
      - "CITATION.cff"
      - ".github/dependabot.yml"
      - "docs/REPRODUCIBILITY_GUIDE.md"
      - "publication/manuscript/07-declarations-and-availability.md"
      - ".github/workflows/validate-research-configs.yml"
  pull_request:
    paths:
      - "configs/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - "src/**"
      - "tests/**"
      - "CITATION.cff"
      - ".github/dependabot.yml"
      - "docs/REPRODUCIBILITY_GUIDE.md"
      - "publication/manuscript/07-declarations-and-availability.md"
      - ".github/workflows/validate-research-configs.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate JSON syntax
        run: |
          python -m json.tool configs/experiment_model.json >/dev/null
          python -m json.tool configs/experiment_run.schema.json >/dev/null
          python -m json.tool configs/toolchain-lock.json >/dev/null
          python -m json.tool configs/wp5_event_catalog.json >/dev/null
          python -m json.tool configs/wp6_policy_rules.json >/dev/null
          python -m json.tool configs/wp6_p01_source_isolation_adapter.json >/dev/null
          python -m json.tool configs/wp6_p2_command_class_adapter.json >/dev/null
          python -m json.tool configs/wp6_p4_safe_mode_adapter.json >/dev/null
          python -m json.tool configs/wp6_p5_rollback_request_adapter.json >/dev/null
          python -m json.tool configs/wp6_p7_mission_aware_integration.json >/dev/null
          python -m json.tool configs/wp7_trusted_recovery_adapter.json >/dev/null

      - name: Validate experiment schema fixtures
        run: python scripts/validate_experiment_schema.py

      - name: Run research unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate WP7 shell syntax
        run: |
          bash -n scripts/run_wp7_trusted_recovery_test.sh
          bash -n scripts/run_wp7_failure_mode_validation.sh

      - name: Validate WP8 shell syntax
        run: |
          bash -n scripts/run_nominal_runtime_preflight.sh
          bash -n scripts/run_wp8_command_binding_preflight.sh
          bash -n scripts/run_wp8_command_stage1_development.sh
          bash -n scripts/run_wp8_recovery_binding_preflight.sh
          bash -n scripts/run_wp8_observability_binding_preflight.sh
          bash -n scripts/run_wp8_observability_stage1_development.sh
          bash -n scripts/run_wp8_stage2_pilot.sh

      - name: Validate WP9 shell syntax
        run: |
          for script in scripts/run_wp9_*.sh; do
            bash -n "$script"
          done
