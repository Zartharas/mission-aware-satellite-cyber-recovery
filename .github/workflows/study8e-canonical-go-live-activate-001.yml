name: Study 8E one-time canonical activation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/study8e-canonical-go-live-activate-001.yml"
      - "study8e/CANONICAL_EXECUTION_ACTIVATION_001.json"

permissions:
  contents: read
  actions: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact activation merge
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify activation lineage and frozen authorization
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "eb9fcedbba3ea7f64aa47e43c66b4904cbd2db7f"
          test "$(git hash-object .github/workflows/study8e-canonical-execution.yml)" = "8d08b8818df1cabec24ef4055ad64f67e703916e"
          test ! -e .github/workflows/study8e-canonical-dispatch-bridge.yml
          test ! -e study8e/CANONICAL_EXECUTION_TRIGGER_001.json
          python - <<'PY'
          import json
          from pathlib import Path

          go = json.loads(Path("study8e/CANONICAL_EXECUTION_GO_LIVE.json").read_text(encoding="utf-8"))
          act = json.loads(Path("study8e/CANONICAL_EXECUTION_ACTIVATION_001.json").read_text(encoding="utf-8"))

          assert go["schema"] == 1
          assert go["experiment_id"] == "S8E-ECTV-001"
          assert go["authorization_id"] == "S8E-CANON-GOLIVE-001"
          assert go["status"] == "AUTHORIZED"
          assert go["canonical_execution_authorized"] is True
          assert go["protocol_id"] == "S8E-CANON-EXEC-001"
          assert go["runner_freeze"] == "S8E-CANON-RUNNER-003"

          assert act["schema"] == 1
          assert act["experiment_id"] == "S8E-ECTV-001"
          assert act["activation_id"] == "S8E-CANON-ACTIVATE-001"
          assert act["authorization_id"] == go["authorization_id"]
          assert act["status"] == "ONE_TIME_DISPATCH_AUTHORIZED"
          assert act["authorized_go_live_commit"] == "eb9fcedbba3ea7f64aa47e43c66b4904cbd2db7f"
          assert act["expected_activation_merge_parent"] == "eb9fcedbba3ea7f64aa47e43c66b4904cbd2db7f"
          assert act["target"]["runner_freeze"] == "S8E-CANON-RUNNER-003"
          assert act["target"]["canonical_workflow_git_blob_sha1"] == "8d08b8818df1cabec24ef4055ad64f67e703916e"
          assert act["target"]["dispatch_input"]["authorization_id"] == "S8E-CANON-GOLIVE-001"
          PY

      - name: Check current main and one-time dispatch state
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          main = get_json(f"https://api.github.com/repos/{repo}/branches/main")
          if main["commit"]["sha"] != sha:
              raise SystemExit(
                  f"main moved before dispatch: expected {sha}, observed {main['commit']['sha']}"
              )

          runs = get_json(
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "study8e-canonical-execution.yml/runs?event=workflow_dispatch&per_page=100"
          )
          matching = [run for run in runs.get("workflow_runs", []) if run.get("head_sha") == sha]

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"dispatch_needed={'false' if matching else 'true'}\n")
              handle.write(f"existing_matching_runs={len(matching)}\n")

          print(f"activation_head={sha}")
          print(f"existing_matching_canonical_runs={len(matching)}")
          PY

      - name: Dispatch authoritative canonical workflow exactly once
        if: steps.preflight.outputs.dispatch_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             --request POST             --header "Authorization: Bearer ${GH_TOKEN}"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/study8e-canonical-execution.yml/dispatches"             --data '{"ref":"main","inputs":{"authorization_id":"S8E-CANON-GOLIVE-001"}}'

      - name: Verify canonical dispatch became visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "study8e-canonical-execution.yml/runs?event=workflow_dispatch&per_page=100"
          )

          for attempt in range(12):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              matching = [run for run in data.get("workflow_runs", []) if run.get("head_sha") == sha]
              if matching:
                  print("canonical_dispatch_run_ids=" + ",".join(str(run["id"]) for run in matching))
                  print(f"canonical_dispatch_count_for_activation_head={len(matching)}")
                  if len(matching) != 1:
                      raise SystemExit("expected exactly one canonical dispatch for activation head")
                  raise SystemExit(0)
              time.sleep(5)

          raise SystemExit("canonical dispatch did not become visible")
          PY

      - name: Confirm activation made no repository changes
        run: git diff --exit-code
