name: Paper 3 IJCIP review-only export

on:
  pull_request:
    paths:
      - ".github/workflows/paper3-ijcip-review-export.yml"
      - "publication/Paper_3_Study_7/Rebuilt_Study7_7E/IJCIP/**"
      - "scripts/audit_paper3_ijcip_r3_enhancements.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate science, figures, ordered bibliography, and statements
        run: python scripts/audit_paper3_ijcip_r3_enhancements.py
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pandoc libreoffice-writer poppler-utils
          python -m pip install --disable-pip-version-check cairosvg==2.7.1 python-docx==1.2.0
      - name: Reconstruct original frozen Study 7E held-out archive (unpublished deposit candidate)
        run: python publication/Paper_3_Study_7/Rebuilt_Study7_7E/IJCIP/prepare_study7e_deposit_candidate.py
      - name: Build candidate Word and PDF review files
        env:
          PAPER3_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python publication/Paper_3_Study_7/Rebuilt_Study7_7E/IJCIP/build_ijcip_review_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: paper3-ijcip-review-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/paper3_ijcip_review_only/
          if-no-files-found: error
          retention-days: 14
      - name: Confirm no tracked-file drift
        run: git diff --exit-code
