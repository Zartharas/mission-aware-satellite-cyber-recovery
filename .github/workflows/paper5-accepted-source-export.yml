name: Paper 5 accepted editable source export
on:
  pull_request:
    paths:
      - ".github/workflows/paper5-accepted-source-export.yml"
permissions:
  contents: read
jobs:
  export:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'paper5/study9-study10-integrated-manuscript-candidate-20261123' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a6321794b91c610fe521e9afcf4d3e9431b4812a
          persist-credentials: false
          sparse-checkout: |
            publication/Paper_5_Study_9/Cyber_Security_and_Applications/integrated_candidate/
          sparse-checkout-cone-mode: false
      - name: Verify immutable source blobs and export allowlisted files only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a6321794b91c610fe521e9afcf4d3e9431b4812a"
          mkdir export
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          base = Path("publication/Paper_5_Study_9/Cyber_Security_and_Applications/integrated_candidate/")
          pins = {
              "CSA_S9_S10_INTEGRATED_CANDIDATE.tex": "b341b21f6fce6a79a09ab1a9954347aa1c8f2ef7",
              "references.bib": "3ba04d326a71eadf881bcc6c2af13b235986d396",
              "PHASE2_FIELD_LEVEL_EVIDENCE_SUPPLEMENT.tex": "62895427a73974179571ecbc28d8bd7b6e169799",
              "PHASE2_FIELD_LEVEL_EVIDENCE_APPENDIX.tex": "77d9542675490bb0934d678560e962414f2a7b82",
              "CSA_S9_S10_INTEGRATED_HIGHLIGHTS.txt": "0b14c7ebb4ca3087f36a4c2da7b597fd6241e295",
          }
          records = {}
          for name, expected in pins.items():
              source = base / name
              assert source.is_file() and not source.is_symlink(), name
              data = source.read_bytes()
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              assert blob == expected, name
              (Path("export") / name).write_bytes(data)
              records[name] = {"git_blob": blob, "sha256": hashlib.sha256(data).hexdigest(), "bytes": len(data)}
          (Path("export") / "SOURCE_MANIFEST.json").write_text(json.dumps({"source_commit": "a6321794b91c610fe521e9afcf4d3e9431b4812a", "files": records}, indent=2) + "\n")
          print("ACCEPTED_SOURCE_EXPORT_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper5-accepted-editable-source
          path: export/
          if-no-files-found: error
          retention-days: 14
