<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mission-aware satellite cyber recovery research workflow</title>
  <desc id="desc">Controlled software-in-the-loop testbed flows through synthetic events and response policies into a frozen campaign, analysis, and a DOI-bearing Zenodo archive.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>

  <text x="60" y="54" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Research workflow and evidence path</text>
  <text x="60" y="82" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="15">Controlled simulation → bounded policy evaluation → integrity-frozen evidence → public reproducibility archive</text>

  <g filter="url(#shadow)">
    <rect x="60" y="118" width="235" height="142" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="92" cy="150" r="16" fill="#2563eb"/>
    <text x="92" y="156" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">1</text>
    <text x="120" y="154" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Controlled SIL testbed</text>
    <text x="82" y="190" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15">NOS3 · Fortytwo · cFS</text>
    <text x="82" y="215" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15">Isolated Docker networking</text>
    <text x="82" y="240" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15">Pinned toolchain identities</text>
  </g>

  <line x1="304" y1="189" x2="345" y2="189" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="365" y="118" width="235" height="142" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <circle cx="397" cy="150" r="16" fill="#059669"/>
    <text x="397" y="156" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">2</text>
    <text x="425" y="154" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Events &amp; responses</text>
    <text x="387" y="190" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15">Synthetic E1–E4 events</text>
    <text x="387" y="215" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15">Fixed + mission-aware policies</text>
    <text x="387" y="240" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15">Evidence-aware recovery paths</text>
  </g>

  <line x1="609" y1="189" x2="650" y2="189" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="670" y="118" width="235" height="142" rx="18" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
    <circle cx="702" cy="150" r="16" fill="#9333ea"/>
    <text x="702" y="156" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">3</text>
    <text x="730" y="154" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Frozen campaign</text>
    <text x="692" y="190" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15">24 cells × 30 repetitions</text>
    <text x="692" y="215" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15">720 VALID observations</text>
    <text x="692" y="240" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15">9 INVALID attempts retained</text>
  </g>

  <line x1="914" y1="189" x2="955" y2="189" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="975" y="118" width="165" height="142" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <circle cx="1007" cy="150" r="16" fill="#ea580c"/>
    <text x="1007" y="156" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">4</text>
    <text x="1035" y="154" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Publication</text>
    <text x="997" y="190" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15">Analysis + figures</text>
    <text x="997" y="215" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15">Integrity freeze</text>
    <text x="997" y="240" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15">Zenodo DOI</text>
  </g>

  <rect x="60" y="292" width="1080" height="38" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="600" y="317" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="15">No operational spacecraft access · No live RF interference · Synthetic/modelled mission, telemetry, evidence, and contact conditions</text>
</svg>
