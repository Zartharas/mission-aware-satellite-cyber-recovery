<rect x="923" y="267.95000000000005" width="62" height="172.04999999999998" fill="#1c6599"/>
<text x="954" y="256.95000000000005" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233247">31</text>
<rect x="1001" y="373.4" width="62" height="66.6" fill="#b8571d"/>
<text x="1032" y="362.4" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233247">12</text>
<text x="995" y="471" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#233247">L1 corroborated</text>
