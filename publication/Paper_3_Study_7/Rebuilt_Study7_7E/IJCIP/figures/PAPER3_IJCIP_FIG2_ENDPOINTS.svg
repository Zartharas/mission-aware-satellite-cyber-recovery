<text x="40" y="516" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">Paired information is identical within D0/L0 and D1/L1; selector logic can still disagree.</text>
<text x="40" y="545" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">F12 adverse learned transfer and C0 no-signal/all-HOLD controls are reported separately.</text>
<text x="40" y="574" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#233247">These bars are finite model results, not empirical safety probabilities or flight measurements.</text>
</svg>
