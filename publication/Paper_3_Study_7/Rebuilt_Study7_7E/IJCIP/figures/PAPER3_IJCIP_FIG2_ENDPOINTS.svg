<text x="778" y="179.25" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233247">45</text>
<text x="741" y="471" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#233247">D1 corroborated</text>
</g>
