<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1220" height="590" viewBox="0 0 1220 590"><title id="title">Study 7E policy error type trade-offs</title><desc id="desc">For each of 196 held-out scenarios: D0 unsafe 9 false conservative 31, L0 unsafe 21 false conservative 26, D1 unsafe 4 false conservative 45, L1 unsafe 31 false conservative 12. Exact finite counts only, not operational probabilities or policy ranks.</desc><rect width="1220" height="590" fill="white"/>
<text x="40" y="44" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#233247">Frozen held-out policy error outcomes</text>
<text x="40" y="76" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#233247">Counts in 196 scenarios per policy; no scalar mission cost or global ranking inferred.</text>
<rect x="645" y="91" width="23" height="23" fill="#1c6599"/><text x="681" y="110" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#233247">Unsafe proceed</text>
<rect x="878" y="91" width="23" height="23" fill="#b8571d"/><text x="911" y="110" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#233247">False-conservative hold</text>
<line x1="86" y1="440" x2="1174" y2="440" stroke="#d5dfe8" stroke-width="1"/>
<text x="76" y="446" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#233247">0</text>
<line x1="86" y1="384.5" x2="1174" y2="384.5" stroke="#d5dfe8" stroke-width="1"/>
<text x="76" y="390.5" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#233247">10</text>
<line x1="86" y1="329" x2="1174" y2="329" stroke="#d5dfe8" stroke-width="1"/>
<text x="76" y="335" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#233247">20</text>
<line x1="86" y1="273.5" x2="1174" y2="273.5" stroke="#d5dfe8" stroke-width="1"/>
<text x="76" y="279.5" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#233247">30</text>
<line x1="86" y1="218" x2="1174" y2="218" stroke="#d5dfe8" stroke-width="1"/>
<text x="76" y="224" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#233247">40</text>
<line x1="86" y1="162.5" x2="1174" y2="162.5" stroke="#d5dfe8" stroke-width="1"/>
<text x="76" y="168.5" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#233247">50</text>
<g data-policy="D0_BASE" data-unsafe="9" data-fch="31">
<rect x="161" y="390.05" width="62" height="49.949999999999996" fill="#1c6599"/>
<text x="192" y="379.05" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233247">9</text>
<rect x="239" y="267.95000000000005" width="62" height="172.04999999999998" fill="#b8571d"/>
<text x="270" y="256.95000000000005" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233247">31</text>
<text x="233" y="471" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#233247">D0 base</text>
</g>
<g data-policy="L0_BASE" data-unsafe="21" data-fch="26">
<rect x="415" y="323.45" width="62" height="116.55" fill="#1c6599"/>
<text x="446" y="312.45" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233247">21</text>
<rect x="493" y="295.70000000000005" width="62" height="144.29999999999998" fill="#b8571d"/>
<text x="524" y="284.70000000000005" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233247">26</text>
<text x="487" y="471" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#233247">L0 base</text>
</g>
