<text x="54" y="486" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">Faults F0–F12 and topologies</text>
<text x="54" y="517" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">Policy-visible vectors</text>
<rect x="449" y="416" width="327" height="134" rx="12" fill="#eaf7f1" stroke="#347b60" stroke-width="1.5"/>
<text x="463" y="443" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#233247">Frozen policy comparisons</text>
<text x="463" y="486" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">Equal base inputs: D0 / L0</text>
<text x="463" y="517" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">Equal corroborated inputs: D1 / L1</text>
<rect x="864" y="416" width="314" height="134" rx="12" fill="#eaf7f1" stroke="#347b60" stroke-width="1.5"/>
<text x="878" y="443" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#233247">Decision outputs + audit</text>
<text x="878" y="486" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">ENTER_RECOVERY_GATE or HOLD</text>
<text x="878" y="517" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">Exact count and hash reconciliation</text>
<path d="M360 487 H440 M776 487 H855" stroke="#277755" stroke-width="4" fill="none"/><path d="M440 487 l-15 -9 v18 z M855 487 l-15 -9 v18 z" fill="#277755"/>
<rect x="40" y="577" width="555" height="98" rx="12" fill="#fff2ed" stroke="#b2735c" stroke-width="1.5"/>
<text x="55" y="607" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#233247">Research-only adjudication (outside policy inputs)</text>
<text x="55" y="638" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">True authorization, readiness, fault and aliasing</text>
<text x="55" y="659" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#9b3d2d">NEVER supplied to D0, L0, D1 or L1</text>
<rect x="615" y="577" width="563" height="98" rx="12" fill="#f4f5f9" stroke="#8292a4" stroke-width="1.5"/>
<text x="630" y="607" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#233247">Strict interpretation boundary</text>
<text x="630" y="638" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">No flight qualification, RF performance, operational risk</text>
<text x="630" y="659" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">or end-to-end onboard learned-policy validation</text>
<text x="40" y="704" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">Diagram expresses contract correspondence only; no claimed live runtime path connects lanes A and B.</text>
<text x="40" y="731" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">Study 7 (1,033 modeled observations) is a separate frozen population, not included in this graphic.</text>
</svg>
