<text x="1088" y="97" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233247">Authority domain</text>
<text x="40" y="155" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#233247">A. cFS engineering qualification: bounded component/message tests</text>
<rect x="40" y="175" width="320" height="132" rx="12" fill="#f1f6fb" stroke="#496789" stroke-width="1.5"/>
<text x="54" y="202" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#233247">Producers + health source</text>
<text x="54" y="243" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">Primary / corroborating evidence</text>
<text x="54" y="274" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">Readiness and authorization inputs</text>
<rect x="449" y="175" width="327" height="132" rx="12" fill="#f1f6fb" stroke="#496789" stroke-width="1.5"/>
<text x="463" y="202" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#233247">cFE / Software Bus contracts</text>
<text x="463" y="243" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">Signed-evidence qualifier</text>
<text x="463" y="274" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">Validation and message routing</text>
<rect x="864" y="175" width="314" height="132" rx="12" fill="#f1f6fb" stroke="#496789" stroke-width="1.5"/>
<text x="878" y="202" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#233247">Deterministic binding + sink</text>
<text x="878" y="243" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">D0/D1 engineering checks</text>
<text x="878" y="274" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233247">Recovery-action sink</text>
<path d="M360 246 H440 M776 246 H855" stroke="#215f9c" stroke-width="4" fill="none"/><path d="M440 246 l-15 -9 v18 z M855 246 l-15 -9 v18 z" fill="#215f9c"/>
<text x="40" y="332" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#8d3d22">Engineering success is not a canonical Study 7E policy-execution result.</text>
<line x1="40" y1="356" x2="1180" y2="356" stroke="#7c8997" stroke-width="2" stroke-dasharray="10 8"/>
<text x="40" y="396" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#233247">B. Frozen Python inference: 196 held-out scenarios / 784 policy decisions</text>
