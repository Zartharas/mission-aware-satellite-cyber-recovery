<text x="618" y="97" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233247">Execution domain</text>
<rect x="745" y="61" width="215" height="58" rx="12" fill="#eaf2fa" stroke="#496789" stroke-width="1.5"/>
<text x="853" y="97" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233247">Transport domain</text>
