<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1220" height="752" viewBox="0 0 1220 752"><title id="title">Study 7E modeled architecture and two evidence boundaries</title><desc id="desc">Five experimental trust domains; cFS engineering qualification shown separately from canonical Python held-out decision inference. Research-only objective truth never enters policy inputs. No integrated onboard learned inference is claimed.</desc><rect width="1220" height="752" fill="white"/>
<text x="40" y="38" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#233247">Figure 1 — Study 7E architecture and scientific execution boundary</text>
<rect x="40" y="61" width="215" height="58" rx="12" fill="#eaf2fa" stroke="#496789" stroke-width="1.5"/>
<text x="148" y="97" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233247">Source domain</text>
