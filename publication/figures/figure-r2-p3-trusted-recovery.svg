<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Figure R2. Trusted recovery by policy and evidence condition</title>
  <desc id="desc">Bar chart for the E3 M4 C0 block showing 30 of 30 trusted recoveries for fixed P5 under T0 and T1, 30 of 30 for P7 under T0, and zero of 30 trusted recoveries with 30 of 30 recovery failures for P7 under T1.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#555" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="white"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .title { font-size: 24px; font-weight: 700; }
    .sub { font-size: 14px; }
    .axis { stroke: #222; stroke-width: 1.5; }
    .grid { stroke: #ccc; stroke-width: 1; stroke-dasharray: 3 5; }
    .tick { font-size: 12px; }
    .lab { font-size: 14px; }
    .value { font-size: 14px; font-weight: 700; }
  </style>

  <text x="40" y="38" class="title">Trusted recovery under full and degraded evidence</text>
  <text x="40" y="62" class="sub">E3 / M4 / C0 retained block; each bar represents 30 valid repetitions.</text>
  <text x="40" y="82" class="sub">The narrower anticipated restoration-without-verification mechanism was not observed.</text>

  <!-- plot area y=120..500, 0..100% -->
  <line x1="110" y1="500" x2="930" y2="500" class="axis"/>
  <line x1="110" y1="120" x2="110" y2="500" class="axis"/>
  <g class="tick">
    <line x1="110" y1="500" x2="930" y2="500" class="grid"/><text x="95" y="505" text-anchor="end">0%</text>
    <line x1="110" y1="405" x2="930" y2="405" class="grid"/><text x="95" y="410" text-anchor="end">25%</text>
    <line x1="110" y1="310" x2="930" y2="310" class="grid"/><text x="95" y="315" text-anchor="end">50%</text>
    <line x1="110" y1="215" x2="930" y2="215" class="grid"/><text x="95" y="220" text-anchor="end">75%</text>
    <line x1="110" y1="120" x2="930" y2="120" class="grid"/><text x="95" y="125" text-anchor="end">100%</text>
  </g>

  <!-- bars -->
  <rect x="180" y="120" width="120" height="380" fill="#444" stroke="#111"/>
  <text x="240" y="108" text-anchor="middle" class="value">30/30 trusted</text>
  <text x="240" y="528" text-anchor="middle" class="lab">Fixed P5</text>
  <text x="240" y="548" text-anchor="middle" class="lab">T0 full evidence</text>

  <rect x="370" y="120" width="120" height="380" fill="url(#hatch)" stroke="#111" stroke-width="1.5"/>
  <text x="430" y="108" text-anchor="middle" class="value">30/30 trusted</text>
  <text x="430" y="528" text-anchor="middle" class="lab">Fixed P5</text>
  <text x="430" y="548" text-anchor="middle" class="lab">T1 degraded</text>

  <rect x="560" y="120" width="120" height="380" fill="#777" stroke="#111"/>
  <text x="620" y="108" text-anchor="middle" class="value">30/30 trusted</text>
  <text x="620" y="528" text-anchor="middle" class="lab">P7</text>
  <text x="620" y="548" text-anchor="middle" class="lab">T0 full evidence</text>

  <rect x="750" y="498" width="120" height="2" fill="url(#hatch)" stroke="#111"/>
  <text x="810" y="472" text-anchor="middle" class="value">0/30 trusted</text>
  <text x="810" y="490" text-anchor="middle" class="lab">30/30 recovery failed</text>
  <text x="810" y="528" text-anchor="middle" class="lab">P7</text>
  <text x="810" y="548" text-anchor="middle" class="lab">T1 degraded</text>

  <text x="25" y="310" transform="rotate(-90 25 310)" text-anchor="middle" class="lab">Trusted-recovery proportion</text>
  <text x="500" y="594" text-anchor="middle" class="sub">Fixed P5 retained trusted recovery across T0/T1; degraded policy-visible evidence produced complete P7 recovery failure in this tested condition.</text>
</svg>