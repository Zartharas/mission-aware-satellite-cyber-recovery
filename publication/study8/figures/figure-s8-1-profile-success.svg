<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Modeled trusted-recovery success by cryptographic profile</title>
  <desc id="desc">Bar chart showing 93.75 percent success for PROFILE_512_44, 64.9306 percent for PROFILE_768_65, and 61.8056 percent for PROFILE_1024_87 across the frozen 3456-position deterministic population.</desc>
  <rect x="0" y="0" width="900" height="540" fill="white"/>
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold">Modeled trusted-recovery success by cryptographic profile</text>
  <text x="450" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Exact finite-population proportions; standardized cryptographic-object budgets only</text>
  <line x1="110" y1="450" x2="840" y2="450" stroke="black" stroke-width="1.5"/>
  <line x1="110" y1="90" x2="110" y2="450" stroke="black" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="black">
    <line x1="105" y1="450" x2="840" y2="450" stroke="#cccccc"/><text x="95" y="455" text-anchor="end">0%</text>
    <line x1="105" y1="378" x2="840" y2="378" stroke="#e0e0e0"/><text x="95" y="383" text-anchor="end">20%</text>
    <line x1="105" y1="306" x2="840" y2="306" stroke="#e0e0e0"/><text x="95" y="311" text-anchor="end">40%</text>
    <line x1="105" y1="234" x2="840" y2="234" stroke="#e0e0e0"/><text x="95" y="239" text-anchor="end">60%</text>
    <line x1="105" y1="162" x2="840" y2="162" stroke="#e0e0e0"/><text x="95" y="167" text-anchor="end">80%</text>
    <line x1="105" y1="90" x2="840" y2="90" stroke="#e0e0e0"/><text x="95" y="95" text-anchor="end">100%</text>
  </g>
  <rect x="175" y="112.5" width="150" height="337.5" fill="#555555"/>
  <rect x="375" y="216.25" width="150" height="233.75" fill="#777777"/>
  <rect x="575" y="227.50" width="150" height="222.50" fill="#999999"/>
  <g font-family="Arial, sans-serif" fill="black" text-anchor="middle">
    <text x="250" y="103" font-size="16" font-weight="bold">93.7500%</text>
    <text x="450" y="207" font-size="16" font-weight="bold">64.9306%</text>
    <text x="650" y="218" font-size="16" font-weight="bold">61.8056%</text>
    <text x="250" y="474" font-size="14">PROFILE_512_44</text>
    <text x="450" y="474" font-size="14">PROFILE_768_65</text>
    <text x="650" y="474" font-size="14">PROFILE_1024_87</text>
    <text x="250" y="496" font-size="12">12,560 bytes</text>
    <text x="450" y="496" font-size="12">17,460 bytes</text>
    <text x="650" y="496" font-size="12">24,236 bytes</text>
  </g>
  <text x="450" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Logical-contact model only; not ML-KEM/ML-DSA execution-speed or spacecraft-performance evidence.</text>
</svg>
